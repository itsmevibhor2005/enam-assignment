name: finn

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finn
      POSTGRES_PASSWORD: finn
      POSTGRES_DB: finn
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 5433 on the host so a local Postgres can keep 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finn -d finn"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://finn:finn@db:5432/finn
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATA_MODE: ${DATA_MODE:-hybrid}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL_CHEAP: ${LLM_MODEL_CHEAP:-gemini-2.5-flash-lite}
      LLM_MODEL_STRONG: ${LLM_MODEL_STRONG:-gemini-2.5-flash}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    volumes:
      # Cached PDFs, extracted text and LLM responses survive a rebuild, so
      # iterating never re-downloads forty annual reports or re-spends tokens.
      - cache:/app/data/cache
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      # Server-side proxy target. The browser only ever calls its own origin,
      # so there is no CORS and no API host baked into the bundle.
      BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  cache:
